<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charbon Youtube</title>
<style>
  :root {
    --bg: #14100D;
    --bg-soft: #1C1712;
    --card: #221B15;
    --ember: #FF6A1F;
    --ember-deep: #C9490F;
    --ember-glow: #FFA766;
    --text: #F3ECE3;
    --muted: #A79A8B;
    --border: #362B21;
    --danger: #E5564B;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ember); }
  button { cursor: pointer; font-family: inherit; border: none; }
  input {
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 11px 13px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  input:focus { border-color: var(--ember); }
  label.field { display: block; margin-bottom: 16px; }
  label.field span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  .btn-primary {
    background: var(--ember);
    color: #1A0900;
    font-weight: 700;
    border-radius: 6px;
    padding: 11px 22px;
    letter-spacing: 0.2px;
  }
  .btn-primary:hover { background: var(--ember-glow); }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border-radius: 6px;
    padding: 11px 22px;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }
  .error-text { color: var(--danger); font-size: 14px; margin-bottom: 14px; }
  .link-btn { background: none; text-decoration: underline; color: var(--ember); padding: 0; font-size: inherit; }

  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,106,31,0.16), transparent 60%),
      var(--bg);
  }
  .auth-box { width: 100%; max-width: 380px; }
  .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; }
  .logo { font-weight: 900; letter-spacing: -0.5px; color: var(--text); }
  .logo span { color: var(--ember); }

  .navbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 16px 24px;
    background: linear-gradient(var(--bg) 65%, transparent);
  }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .icon-btn { background: none; color: var(--text); padding: 4px; display: flex; font-size: 14px; opacity: 0.85; }
  .icon-btn:hover { opacity: 1; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 24px 22px; }
  .chip {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
  }
  .chip.active { background: var(--ember); color: #1A0900; border-color: var(--ember); font-weight: 700; }
  .chip:hover:not(.active) { border-color: var(--ember-deep); color: var(--text); }

  .hero { position: relative; width: 100%; height: 460px; margin-bottom: 30px; background-color: var(--card); background-size: cover; background-position: center; }
  .hero-shade { position: absolute; inset: 0;
    background: linear-gradient(to top, var(--bg) 8%, transparent 62%), linear-gradient(to right, var(--bg) 18%, transparent 55%); }
  .hero-content { position: absolute; bottom: 44px; left: 24px; max-width: 580px; }
  .hero-cat { color: var(--ember-glow); font-size: 13px; margin-bottom: 10px; font-weight: 600; }
  .hero-title { font-size: 42px; line-height: 1.08; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
  .hero-desc { color: var(--muted); font-size: 14.5px; margin-top: 14px; line-height: 1.55; }
  .hero-actions { display: flex; gap: 12px; margin-top: 22px; }
  .hero-actions button { display: flex; align-items: center; gap: 8px; font-size: 15px; }

  .content { padding: 0 24px 60px; }
  .row { margin-bottom: 38px; }
  .row h2 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
  .row-track { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; }
  .grid-track { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .conf-card {
    position: relative;
    flex-shrink: 0; width: 256px; border-radius: 9px; overflow: hidden; border: 2px solid var(--border);
    background: var(--card); text-align: left; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    scroll-snap-align: start; animation: cardIn .35s ease both;
  }
  .grid-track .conf-card { width: 100%; }
  .conf-card:hover, .conf-card:focus-visible {
    transform: translateY(-6px);
    border-color: var(--ember);
    box-shadow: 0 10px 28px rgba(255,106,31,0.28);
    z-index: 5;
  }
  .conf-thumb {
    width: 100%; height: 144px; background-color: #2B2219; background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px;
    transition: transform .3s ease; transform: scale(1);
  }
  .conf-card:hover .conf-thumb { transform: scale(1.06); }
  .conf-info { padding: 11px 13px; }
  .conf-info .title { color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conf-info .cat { font-size: 12px; color: var(--ember-glow); margin-top: 4px; }
  .conf-badge {
    position: absolute; top: 8px; left: 8px; background: var(--ember); color: #1A0900;
    font-size: 10px; font-weight: 800; letter-spacing: 0.4px; padding: 3px 8px; border-radius: 4px; z-index: 2;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .empty-state { text-align: center; padding: 100px 20px; color: var(--muted); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(10,7,5,0.86); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-box { width: 100%; max-width: 760px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .modal-video { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  .modal-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modal-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 24px; color: var(--muted); }
  .modal-body { padding: 22px; }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .modal-head h3 { margin: 0; font-size: 22px; font-weight: 700; }
  .modal-desc { color: var(--muted); font-size: 14px; line-height: 1.6; margin-top: 12px; }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (max-width: 900px) {
    .grid-track { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .hero { height: 380px; }
    .hero-title { font-size: 32px; }
  }
  @media (max-width: 600px) {
    .navbar { padding: 12px 16px; }
    .content { padding: 0 16px 40px; }
    .chips { padding: 0 16px 18px; }
    .grid-track { grid-template-columns: 1fr; }
    .hero { height: 340px; }
    .hero-content { left: 16px; right: 16px; max-width: none; }
    .hero-title { font-size: 26px; }
    input { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =========================================================================
   LES CONFERENCES SONT ICI, EN DUR DANS LE CODE (plus de bouton "Gérer",
   donc plus aucun risque de suppression accidentelle).
   Pour en ajouter une : copie un bloc { ... } ci-dessous et modifie les
   valeurs. Pour en retirer une : supprime son bloc.
   L'ordre de la liste = l'ordre d'affichage. Le premier élément devient
   la conférence mise en avant dans le bandeau du haut.
   ========================================================================= */
const CONFERENCES = [
  {
    id: "conf-miniatures-wixuu",
    title: "Comment faire de bonnes miniatures",
    category: "Montage",
    coverImage: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg",
    videoUrl: "https://youtu.be/JszJgxNBAMg",
    description: "Conférence réalisée par Wixuu.",
  },
];

/* ---------- comptes utilisateurs (juste pour l'accès, stockés localement dans le navigateur) ---------- */
const LOCAL_KEYS = { users: "charbon_users", session: "charbon_session" };
function loadUsers() { try { const r = localStorage.getItem(LOCAL_KEYS.users); return r ? JSON.parse(r) : []; } catch (e) { return []; } }
function saveUsers(list) { localStorage.setItem(LOCAL_KEYS.users, JSON.stringify(list)); }
function loadSession() { try { const r = localStorage.getItem(LOCAL_KEYS.session); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function saveSession(v) { if (v) localStorage.setItem(LOCAL_KEYS.session, JSON.stringify(v)); else localStorage.removeItem(LOCAL_KEYS.session); }

async function hashPassword(pw) {
  try {
    if (window.crypto && window.crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) {}
  let h = 0;
  for (let i = 0; i < pw.length; i++) { h = (h * 31 + pw.charCodeAt(i)) >>> 0; }
  return "fallback-" + h.toString(16);
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function getYoutubeThumbnail(rawUrl) {
  if (!rawUrl) return "";
  try {
    const u = new URL(rawUrl.trim());
    const host = u.hostname.replace(/^www\./, "");
    let id = "";
    if (host === "youtu.be") id = u.pathname.split("/").filter(Boolean)[0] || "";
    if (host === "youtube.com" || host === "m.youtube.com") {
      id = u.searchParams.get("v") || (u.pathname.startsWith("/shorts/") ? u.pathname.split("/")[2] : "") || (u.pathname.startsWith("/live/") ? u.pathname.split("/")[2] : "");
    }
    return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
  } catch (e) { return ""; }
}

function getEmbedUrl(rawUrl) {
  try {
    const u = new URL(rawUrl.trim());
    const host = u.hostname.replace(/^www\./, "");
    if (host === "youtube.com" || host === "m.youtube.com") {
      if (u.pathname.startsWith("/embed/")) return rawUrl;
      const id = u.searchParams.get("v");
      if (id) return "https://www.youtube.com/embed/" + id;
      if (u.pathname.startsWith("/live/")) return "https://www.youtube.com/embed/" + u.pathname.split("/")[2];
    }
    if (host === "youtu.be") {
      const id = u.pathname.replace("/", "");
      if (id) return "https://www.youtube.com/embed/" + id;
    }
    if (host === "vimeo.com") {
      const id = u.pathname.split("/").filter(Boolean).pop();
      if (id) return "https://player.vimeo.com/video/" + id;
    }
    if (host === "player.vimeo.com") return rawUrl;
  } catch (e) { return null; }
  return null;
}

const state = {
  currentUser: loadSession(),
  authMode: "login",
  authError: "",
  search: "",
  activeCategory: null,
  selectedConfId: null,
};

const root = document.getElementById("root");

function render() {
  if (!state.currentUser) { renderAuth(); return; }
  renderApp();
}

function renderAuth() {
  const isSignup = state.authMode === "signup";
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-box">
        <div style="text-align:center; margin-bottom:28px;">
          <div class="logo" style="font-size:30px;">Charbon<span>Youtube</span></div>
          <p style="color:var(--muted); font-size:14px; margin-top:8px;">Les conférences qui font avancer tes vidéos</p>
        </div>
        <div class="auth-card">
          <h1 style="font-size:20px; margin:0 0 20px; font-weight:800;">${isSignup ? "Créer un compte" : "Se connecter"}</h1>
          <form id="auth-form">
            <label class="field"><span>Identifiant</span><input id="f-username" autocomplete="username" /></label>
            <label class="field"><span>Mot de passe</span><input id="f-password" type="password" autocomplete="${isSignup ? "new-password" : "current-password"}" /></label>
            ${isSignup ? `<label class="field"><span>Confirmer le mot de passe</span><input id="f-confirm" type="password" /></label>` : ""}
            ${state.authError ? `<p class="error-text">${escapeHtml(state.authError)}</p>` : ""}
            <button type="submit" class="btn-primary" style="width:100%;">${isSignup ? "Créer le compte" : "Se connecter"}</button>
          </form>
          <p style="text-align:center; font-size:14px; color:var(--muted); margin-top:18px;">
            ${isSignup ? "Déjà un compte ? " : "Pas encore de compte ? "}
            <button class="link-btn" onclick="switchAuthMode()">${isSignup ? "Se connecter" : "Créer un compte"}</button>
          </p>
        </div>
      </div>
    </div>
  `;
  document.getElementById("auth-form").addEventListener("submit", handleAuthSubmit);
}

function switchAuthMode() {
  state.authMode = state.authMode === "login" ? "signup" : "login";
  state.authError = "";
  render();
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const username = document.getElementById("f-username").value.trim();
  const password = document.getElementById("f-password").value;
  if (!username || !password) { state.authError = "Renseigne un identifiant et un mot de passe."; render(); return; }
  const users = loadUsers();

  if (state.authMode === "login") {
    const hash = await hashPassword(password);
    const found = users.find(u => u.username.toLowerCase() === username.toLowerCase());
    if (!found || found.passwordHash !== hash) { state.authError = "Identifiant ou mot de passe incorrect."; render(); return; }
    state.authError = "";
    state.currentUser = { username: found.username };
    saveSession(state.currentUser);
    render();
  } else {
    const confirmVal = document.getElementById("f-confirm").value;
    if (password.length < 6) { state.authError = "Le mot de passe doit faire au moins 6 caractères."; render(); return; }
    if (password !== confirmVal) { state.authError = "Les mots de passe ne correspondent pas."; render(); return; }
    if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) { state.authError = "Cet identifiant existe déjà."; render(); return; }
    const passwordHash = await hashPassword(password);
    users.push({ username, passwordHash });
    saveUsers(users);
    state.authError = "";
    state.currentUser = { username };
    saveSession(state.currentUser);
    render();
  }
}

function logout() {
  state.currentUser = null;
  saveSession(null);
  render();
}

function renderApp() {
  const q = state.search.trim().toLowerCase();
  const categories = [...new Set(CONFERENCES.map(c => c.category || "Sans catégorie"))];
  let visible = CONFERENCES;
  if (q) visible = visible.filter(c => c.title.toLowerCase().includes(q) || (c.category || "").toLowerCase().includes(q));
  if (state.activeCategory) visible = visible.filter(c => (c.category || "Sans catégorie") === state.activeCategory);
  const featured = CONFERENCES[0];

  let bodyHtml = "";
  if (CONFERENCES.length === 0) {
    bodyHtml = `<div class="empty-state">Aucune conférence pour l'instant.</div>`;
  } else if (q || state.activeCategory) {
    const label = q ? `Résultats pour "${escapeHtml(state.search)}"` : escapeHtml(state.activeCategory);
    bodyHtml = visible.length
      ? `<div class="row"><h2>${label}</h2><div class="grid-track">${visible.map(renderCardHtml).join("")}</div></div>`
      : `<div class="empty-state">Rien à afficher ici.</div>`;
  } else {
    bodyHtml = categories.map(cat => renderRowHtml(cat, CONFERENCES.filter(c => (c.category || "Sans catégorie") === cat))).join("");
  }

  const chipsHtml = categories.length > 1 ? `
    <div class="chips">
      <button class="chip ${!state.activeCategory ? "active" : ""}" onclick="setCategory(null)">Toutes</button>
      ${categories.map(cat => `<button class="chip ${state.activeCategory === cat ? "active" : ""}" onclick="setCategory('${cat.replace(/'/g, "\\'")}')">${escapeHtml(cat)}</button>`).join("")}
    </div>
  ` : "";

  root.innerHTML = `
    <nav class="navbar">
      <div class="logo" style="font-size:22px;">Charbon<span>Youtube</span></div>
      <div class="nav-right">
        <div style="position:relative; width:200px;">
          <input id="search-input" placeholder="Rechercher..." value="${escapeHtml(state.search)}" style="padding:8px 30px 8px 12px;" oninput="handleSearch(this.value)" />
          ${state.search ? `<button class="icon-btn" onclick="handleSearch('')" style="position:absolute; right:4px; top:50%; transform:translateY(-50%); font-size:13px; padding:2px 6px;">×</button>` : ""}
        </div>
        <span style="font-size:14px; color:var(--muted);">${escapeHtml(state.currentUser.username)}</span>
        <button class="icon-btn" onclick="logout()" title="Se déconnecter">Quitter</button>
      </div>
    </nav>
    ${featured && !q && !state.activeCategory ? `
      <div class="hero" id="hero-el">
        <div class="hero-shade"></div>
        <div class="hero-content">
          <div class="hero-cat">${escapeHtml(featured.category || "")}</div>
          <h1 class="hero-title">${escapeHtml(featured.title)}</h1>
          ${featured.description ? `<p class="hero-desc">${escapeHtml(featured.description).slice(0, 220)}</p>` : ""}
          <div class="hero-actions">
            <button class="btn-primary" onclick="openConf('${featured.id}')">Regarder</button>
            <button class="btn-secondary" onclick="openConf('${featured.id}')">Plus d'infos</button>
          </div>
        </div>
      </div>
    ` : ""}
    ${chipsHtml}
    <div class="content">${bodyHtml}</div>
    <div id="modal-root"></div>
  `;

  if (featured && !q && !state.activeCategory) {
    const heroCover = getYoutubeThumbnail(featured.videoUrl) || featured.coverImage;
    if (heroCover) document.getElementById("hero-el").style.backgroundImage = `url("${heroCover}")`;
  }
  document.querySelectorAll(".conf-thumb[data-cover]").forEach(elm => {
    const cover = elm.getAttribute("data-cover");
    if (cover) elm.style.backgroundImage = `url("${cover}")`;
  });

  renderModal();
}

function renderCardHtml(c) {
  const cover = getYoutubeThumbnail(c.videoUrl) || c.coverImage;
  return `
    <button class="conf-card" onclick="openConf('${c.id}')">
      <div class="conf-thumb" data-cover="${escapeHtml(cover)}">${cover ? "" : "Pas d'image"}</div>
      <div class="conf-info">
        <div class="title">${escapeHtml(c.title)}</div>
        <div class="cat">${escapeHtml(c.category || "Sans catégorie")}</div>
      </div>
    </button>
  `;
}

function renderRowHtml(title, items) {
  if (!items.length) return "";
  return `<div class="row"><h2>${escapeHtml(title)}</h2><div class="row-track">${items.map(renderCardHtml).join("")}</div></div>`;
}

function setCategory(cat) { state.activeCategory = cat; renderApp(); }

function handleSearch(value) {
  state.search = value;
  const wasFocused = document.activeElement && document.activeElement.id === "search-input";
  renderApp();
  if (wasFocused) {
    const inp = document.getElementById("search-input");
    inp.focus();
    inp.selectionStart = inp.selectionEnd = inp.value.length;
  }
}

function openConf(id) { state.selectedConfId = id; renderModal(); }
function closeConf() { state.selectedConfId = null; renderModal(); }

function renderModal() {
  const holder = document.getElementById("modal-root");
  if (!holder) return;
  const conf = CONFERENCES.find(c => c.id === state.selectedConfId);
  if (!conf) { holder.innerHTML = ""; return; }
  const embed = getEmbedUrl(conf.videoUrl);
  holder.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeConf()">
      <div class="modal-box">
        <div class="modal-video">
          ${embed
            ? `<iframe src="${escapeHtml(embed)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="${escapeHtml(conf.title)}"></iframe>`
            : `<div class="modal-fallback"><p>Lien vidéo non reconnu, ouvre-le directement :</p><a href="${escapeHtml(conf.videoUrl)}" target="_blank" rel="noreferrer">${escapeHtml(conf.videoUrl)}</a></div>`}
        </div>
        <div class="modal-body">
          <div class="modal-head">
            <div>
              <h3>${escapeHtml(conf.title)}</h3>
              <div class="hero-cat" style="margin-top:6px;">${escapeHtml(conf.category || "")}</div>
            </div>
            <button class="icon-btn" onclick="closeConf()">Fermer</button>
          </div>
          ${conf.description ? `<p class="modal-desc">${escapeHtml(conf.description)}</p>` : ""}
        </div>
      </div>
    </div>
  `;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.selectedConfId) closeConf();
});

render();
</script>
</body>
</html>
