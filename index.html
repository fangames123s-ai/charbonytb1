<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Charbon Youtube</title>
<style>
  :root {
    --bg: #14100D;
    --bg-soft: #1C1712;
    --card: #221B15;
    --card-hover: #2B2219;
    --ember: #FF6A1F;
    --ember-deep: #C9490F;
    --ember-glow: #FFA766;
    --text: #F3ECE3;
    --muted: #A79A8B;
    --border: #362B21;
    --danger: #E5564B;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ember); }
  button { cursor: pointer; font-family: inherit; border: none; }
  input, textarea {
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 11px 13px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--ember); }
  label.field { display: block; margin-bottom: 16px; }
  label.field span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  .btn-primary {
    background: var(--ember);
    color: #1A0900;
    font-weight: 700;
    border-radius: 6px;
    padding: 11px 22px;
    letter-spacing: 0.2px;
  }
  .btn-primary:hover { background: var(--ember-glow); }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border-radius: 6px;
    padding: 11px 22px;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }
  .error-text { color: var(--danger); font-size: 14px; margin-bottom: 14px; }
  .link-btn { background: none; text-decoration: underline; color: var(--ember); padding: 0; font-size: inherit; }

  .offline-banner {
    background: #3A2412; color: var(--ember-glow); font-size: 13px;
    text-align: center; padding: 8px 16px; border-bottom: 1px solid var(--border);
  }

  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,106,31,0.16), transparent 60%),
      var(--bg);
  }
  .auth-box { width: 100%; max-width: 380px; }
  .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; }
  .logo { font-weight: 900; letter-spacing: -0.5px; color: var(--text); }
  .logo span { color: var(--ember); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 14px; }

  .navbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 16px 24px;
    background: linear-gradient(var(--bg) 65%, transparent);
  }
  .nav-left { display: flex; align-items: center; gap: 26px; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .icon-btn { background: none; color: var(--text); padding: 4px; display: flex; font-size: 17px; opacity: 0.85; }
  .icon-btn:hover { opacity: 1; }
  .admin-link { display: flex; align-items: center; gap: 6px; background: rgba(255,106,31,0.12); color: var(--ember-glow); font-size: 13px; padding: 7px 12px; border-radius: 20px; font-weight: 600; }
  .admin-link:hover { background: rgba(255,106,31,0.2); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 24px 22px; }
  .chip {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
  }
  .chip.active { background: var(--ember); color: #1A0900; border-color: var(--ember); font-weight: 700; }
  .chip:hover:not(.active) { border-color: var(--ember-deep); color: var(--text); }

  .hero { position: relative; width: 100%; height: 460px; margin-bottom: 30px; background-color: var(--card); background-size: cover; background-position: center; }
  .hero-shade { position: absolute; inset: 0;
    background: linear-gradient(to top, var(--bg) 8%, transparent 62%), linear-gradient(to right, var(--bg) 18%, transparent 55%); }
  .hero-content { position: absolute; bottom: 44px; left: 24px; max-width: 580px; }
  .hero-cat { color: var(--ember-glow); font-size: 13px; margin-bottom: 10px; font-weight: 600; }
  .hero-title { font-size: 42px; line-height: 1.08; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
  .hero-desc { color: var(--muted); font-size: 14.5px; margin-top: 14px; line-height: 1.55; }
  .hero-actions { display: flex; gap: 12px; margin-top: 22px; }
  .hero-actions button { display: flex; align-items: center; gap: 8px; font-size: 15px; }

  .content { padding: 0 24px 60px; }
  .row { margin-bottom: 38px; }
  .row h2 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
  .row-track { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; }
  .grid-track { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .conf-card {
    flex-shrink: 0; width: 256px; border-radius: 9px; overflow: hidden; border: 1px solid var(--border);
    background: var(--card); text-align: left; transition: transform .18s ease, border-color .18s ease;
    scroll-snap-align: start;
  }
  .grid-track .conf-card { width: 100%; }
  .conf-card:hover { transform: translateY(-4px); border-color: var(--ember-deep); z-index: 5; position: relative; }
  .conf-thumb { width: 100%; height: 144px; background-color: #2B2219; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
  .conf-info { padding: 11px 13px; }
  .conf-info .title { color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conf-info .cat { font-size: 12px; color: var(--ember-glow); margin-top: 4px; }

  .empty-state { text-align: center; padding: 100px 20px; color: var(--muted); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(10,7,5,0.86); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-box { width: 100%; max-width: 760px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .modal-video { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  .modal-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modal-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 24px; color: var(--muted); }
  .modal-body { padding: 22px; }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .modal-head h3 { margin: 0; font-size: 22px; font-weight: 700; }
  .modal-desc { color: var(--muted); font-size: 14px; line-height: 1.6; margin-top: 12px; }

  .admin-wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px; }
  .admin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
  .admin-head h1 { display: flex; align-items: center; gap: 10px; font-size: 26px; margin: 0; font-weight: 800; }
  .admin-grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
  @media (min-width: 800px) { .admin-grid { grid-template-columns: 1fr 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .panel h2 { font-size: 16px; margin: 0 0 16px; font-weight: 700; }
  .conf-list-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; border-radius: 7px; background: var(--bg-soft); border: 1px solid var(--border); margin-bottom: 8px; }
  .conf-list-item .title { color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conf-list-item .cat { font-size: 12px; color: var(--ember-glow); }
  .del-btn { background: none; color: var(--danger); padding: 6px; flex-shrink: 0; font-size: 16px; }
  .conf-list { max-height: 440px; overflow-y: auto; }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
<style>
/* Responsive PC + mobile */
html, body { width: 100%; overflow-x: hidden; }
body { -webkit-text-size-adjust: 100%; }
.container, .app-shell, main, .content { width: 100%; box-sizing: border-box; }
img, iframe, video { max-width: 100%; }
button, input, select, textarea { max-width: 100%; box-sizing: border-box; }

@media (min-width: 901px) {
  .container { max-width: 1200px; margin: 0 auto; padding-left: 28px; padding-right: 28px; }
  .grid, .conferences-grid, .cards-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
}

@media (max-width: 900px) {
  .container { padding-left: 18px; padding-right: 18px; }
  .grid, .conferences-grid, .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .hero { min-height: 360px; }
}

@media (max-width: 600px) {
  .container { padding-left: 12px; padding-right: 12px; }
  header, nav { flex-wrap: wrap; }
  .grid, .conferences-grid, .cards-grid { grid-template-columns: 1fr; gap: 12px; }
  .hero { min-height: 300px; padding: 20px; }
  .hero h1 { font-size: clamp(26px, 8vw, 42px); line-height: 1.08; }
  .hero p { font-size: 14px; }
  .card, .conference-card { width: 100%; min-width: 0; }
  .modal, .modal-content { width: calc(100vw - 24px); max-width: none; margin: 12px; }
  iframe { width: 100%; aspect-ratio: 16 / 9; height: auto; }
  input, select, textarea, button { font-size: 16px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script>
const SYNCED = typeof window.storage !== "undefined";
const LOCAL_KEYS = { users: "charbon_users", conferences: "charbon_conferences", session: "charbon_session" };

async function loadUsers() {
  if (SYNCED) {
    try { const r = await window.storage.get("users", true); return r && r.value ? JSON.parse(r.value) : []; }
    catch (e) { return []; }
  }
  try { const raw = localStorage.getItem(LOCAL_KEYS.users); return raw ? JSON.parse(raw) : []; } catch (e) { return []; }
}
async function saveUsers(list) {
  if (SYNCED) { try { await window.storage.set("users", JSON.stringify(list), true); } catch (e) {} return; }
  localStorage.setItem(LOCAL_KEYS.users, JSON.stringify(list));
}
async function loadConferences() {
  const defaultConferences = [
    {
      id: "conf-miniatures-wixuu",
      title: "Comment faire de bonnes miniatures",
      category: "Miniatures",
      coverImage: "https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg",
      videoUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
      description: "Conférence réalisée par Wixuu.",
      createdAt: 1000000000000
    }
  ];
  if (SYNCED) {
    try {
      const r = await window.storage.get("conferences", true);
      if (r && r.value) {
        const saved = JSON.parse(r.value);
        if (Array.isArray(saved) && saved.length > 0) return saved;
      }
      await window.storage.set("conferences", JSON.stringify(defaultConferences), true);
      return defaultConferences;
    } catch (e) { return defaultConferences; }
  }
  try {
    const raw = localStorage.getItem(LOCAL_KEYS.conferences);
    if (raw) {
      const saved = JSON.parse(raw);
      if (Array.isArray(saved) && saved.length > 0) return saved;
    }
    localStorage.setItem(LOCAL_KEYS.conferences, JSON.stringify(defaultConferences));
    return defaultConferences;
  } catch (e) {
    return defaultConferences;
  }
}
async function saveConferences(list) {
  if (SYNCED) { try { await window.storage.set("conferences", JSON.stringify(list), true); } catch (e) {} return; }
  localStorage.setItem(LOCAL_KEYS.conferences, JSON.stringify(list));
}
function loadSession() { try { const r = localStorage.getItem(LOCAL_KEYS.session); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function saveSession(v) { if (v) localStorage.setItem(LOCAL_KEYS.session, JSON.stringify(v)); else localStorage.removeItem(LOCAL_KEYS.session); }

async function hashPassword(pw) {
  try {
    if (window.crypto && window.crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) {}
  let h = 0;
  for (let i = 0; i < pw.length; i++) { h = (h * 31 + pw.charCodeAt(i)) >>> 0; }
  return "fallback-" + h.toString(16);
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function getYoutubeThumbnail(rawUrl) {
  if (!rawUrl) return "";
  try {
    const u = new URL(rawUrl.trim());
    const host = u.hostname.replace(/^www\./, "");
    let id = "";
    if (host === "youtu.be") id = u.pathname.split("/").filter(Boolean)[0] || "";
    if (host === "youtube.com" || host === "m.youtube.com") {
      id = u.searchParams.get("v") || (u.pathname.startsWith("/shorts/") ? u.pathname.split("/")[2] : "") || (u.pathname.startsWith("/live/") ? u.pathname.split("/")[2] : "");
    }
    return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
  } catch (e) { return ""; }
}

function getEmbedUrl(rawUrl) {
  try {
    const u = new URL(rawUrl.trim());
    const host = u.hostname.replace(/^www\./, "");
    if (host === "youtube.com" || host === "m.youtube.com") {
      if (u.pathname.startsWith("/embed/")) return rawUrl;
      const id = u.searchParams.get("v");
      if (id) return "https://www.youtube.com/embed/" + id;
      if (u.pathname.startsWith("/live/")) return "https://www.youtube.com/embed/" + u.pathname.split("/")[2];
    }
    if (host === "youtu.be") {
      const id = u.pathname.replace("/", "");
      if (id) return "https://www.youtube.com/embed/" + id;
    }
    if (host === "vimeo.com") {
      const id = u.pathname.split("/").filter(Boolean).pop();
      if (id) return "https://player.vimeo.com/video/" + id;
    }
    if (host === "player.vimeo.com") return rawUrl;
  } catch (e) { return null; }
  return null;
}

const ADMIN_CODE = "CHARBON-ADMIN-2024";

const state = {
  users: [],
  conferences: [],
  currentUser: loadSession(),
  authMode: "login",
  authError: "",
  showAdmin: false,
  search: "",
  activeCategory: null,
  selectedConfId: null,
  ready: false,
};

const root = document.getElementById("root");

async function init() {
  const [users, conferences] = await Promise.all([loadUsers(), loadConferences()]);
  state.users = users;
  state.conferences = conferences;
  state.ready = true;
  render();
}

function render() {
  if (!state.ready) {
    root.innerHTML = `<div class="auth-wrap"><p style="color:var(--muted);">Chargement...</p></div>`;
    return;
  }
  if (!state.currentUser) { renderAuth(); return; }
  renderApp();
}

function offlineBannerHtml() {
  return "";
}

function renderAuth() {
  const isSignup = state.authMode === "signup";
  root.innerHTML = `
    ${offlineBannerHtml()}
    <div class="auth-wrap">
      <div class="auth-box">
        <div style="text-align:center; margin-bottom:28px;">
          <div class="logo" style="font-size:30px;">Charbon<span>Youtube</span></div>
          <p style="color:var(--muted); font-size:14px; margin-top:8px;">Les conférences qui font avancer tes vidéos</p>
        </div>
        <div class="auth-card">
          <h1 style="font-size:20px; margin:0 0 20px; font-weight:800;">${isSignup ? "Créer un compte" : "Se connecter"}</h1>
          <form id="auth-form">
            <label class="field"><span>Identifiant</span><input id="f-username" autocomplete="username" /></label>
            <label class="field"><span>Mot de passe</span><input id="f-password" type="password" autocomplete="${isSignup ? "new-password" : "current-password"}" /></label>
            ${isSignup ? `
              <label class="field"><span>Confirmer le mot de passe</span><input id="f-confirm" type="password" /></label>
              <div class="checkbox-row"><input type="checkbox" id="f-wants-admin" onchange="toggleAdminField()" /> Créer un compte administrateur</div>
              <div id="admin-code-field" style="display:none;">
                <label class="field"><span>Code administrateur</span><input id="f-admin-code" /></label>
              </div>
            ` : ""}
            ${state.authError ? `<p class="error-text">${escapeHtml(state.authError)}</p>` : ""}
            <button type="submit" class="btn-primary" style="width:100%;">${isSignup ? "Créer le compte" : "Se connecter"}</button>
          </form>
          <p style="text-align:center; font-size:14px; color:var(--muted); margin-top:18px;">
            ${isSignup ? "Déjà un compte ? " : "Pas encore de compte ? "}
            <button class="link-btn" onclick="switchAuthMode()">${isSignup ? "Se connecter" : "Créer un compte"}</button>
          </p>
        </div>
      </div>
    </div>
  `;
  document.getElementById("auth-form").addEventListener("submit", handleAuthSubmit);
}

function toggleAdminField() {
  const box = document.getElementById("f-wants-admin");
  document.getElementById("admin-code-field").style.display = box.checked ? "block" : "none";
}

function switchAuthMode() {
  state.authMode = state.authMode === "login" ? "signup" : "login";
  state.authError = "";
  render();
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const username = document.getElementById("f-username").value.trim();
  const password = document.getElementById("f-password").value;
  if (!username || !password) { state.authError = "Renseigne un identifiant et un mot de passe."; render(); return; }

  if (state.authMode === "login") {
    const hash = await hashPassword(password);
    const found = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
    if (!found || found.passwordHash !== hash) { state.authError = "Identifiant ou mot de passe incorrect."; render(); return; }
    state.authError = "";
    state.currentUser = { username: found.username, isAdmin: found.isAdmin };
    saveSession(state.currentUser);
    render();
  } else {
    const confirmVal = document.getElementById("f-confirm").value;
    const wantsAdmin = document.getElementById("f-wants-admin").checked;
    const adminCode = wantsAdmin ? document.getElementById("f-admin-code").value : "";
    if (password.length < 6) { state.authError = "Le mot de passe doit faire au moins 6 caractères."; render(); return; }
    if (password !== confirmVal) { state.authError = "Les mots de passe ne correspondent pas."; render(); return; }
    if (wantsAdmin && adminCode !== ADMIN_CODE) { state.authError = "Code administrateur incorrect."; render(); return; }
    const fresh = await loadUsers();
    if (fresh.some(u => u.username.toLowerCase() === username.toLowerCase())) { state.authError = "Cet identifiant existe déjà."; render(); return; }
    const passwordHash = await hashPassword(password);
    const newUser = { username, passwordHash, isAdmin: wantsAdmin };
    state.users = [...fresh, newUser];
    await saveUsers(state.users);
    state.authError = "";
    state.currentUser = { username, isAdmin: wantsAdmin };
    saveSession(state.currentUser);
    render();
  }
}

function logout() {
  state.currentUser = null;
  saveSession(null);
  render();
}

function renderApp() {
  if (state.showAdmin) { renderAdminView(); return; }

  const q = state.search.trim().toLowerCase();
  const sorted = [...state.conferences].sort((a, b) => b.createdAt - a.createdAt);
  const categories = [...new Set(sorted.map(c => c.category))].sort();
  let visible = sorted;
  if (q) visible = visible.filter(c => c.title.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
  if (state.activeCategory) visible = visible.filter(c => c.category === state.activeCategory);
  const featured = sorted[0];

  let bodyHtml = "";
  if (sorted.length === 0) {
    bodyHtml = `<div class="empty-state">Aucune conférence pour l'instant.${state.currentUser.isAdmin ? " Ajoute la première depuis l'espace admin." : " Reviens un peu plus tard."}</div>`;
  } else if (q || state.activeCategory) {
    const label = q ? `Résultats pour "${escapeHtml(state.search)}"` : escapeHtml(state.activeCategory);
    bodyHtml = visible.length
      ? `<div class="row"><h2>${label}</h2><div class="grid-track">${visible.map(renderCardHtml).join("")}</div></div>`
      : `<div class="empty-state">Rien à afficher ici.</div>`;
  } else {
    bodyHtml = categories.map(cat => renderRowHtml(cat, sorted.filter(c => c.category === cat))).join("");
  }

  const chipsHtml = categories.length ? `
    <div class="chips">
      <button class="chip ${!state.activeCategory ? "active" : ""}" onclick="setCategory(null)">Toutes</button>
      ${categories.map(cat => `<button class="chip ${state.activeCategory === cat ? "active" : ""}" onclick="setCategory('${cat.replace(/'/g, "\\'")}')">${escapeHtml(cat)}</button>`).join("")}
    </div>
  ` : "";

  root.innerHTML = `
    ${offlineBannerHtml()}
    <nav class="navbar">
      <div class="nav-left">
        <div class="logo" style="font-size:22px;">Charbon<span>Youtube</span></div>
        ${state.currentUser.isAdmin ? `<button class="admin-link" onclick="openAdmin()">Gérer</button>` : ""}
      </div>
      <div class="nav-right">
        <input id="search-input" placeholder="Rechercher..." value="${escapeHtml(state.search)}" style="width:200px; padding:8px 12px;" oninput="handleSearch(this.value)" />
        <span style="font-size:14px; color:var(--muted);">${escapeHtml(state.currentUser.username)}</span>
        <button class="icon-btn" onclick="logout()" title="Se déconnecter">Quitter</button>
      </div>
    </nav>
    ${featured && !q && !state.activeCategory ? `
      <div class="hero" id="hero-el">
        <div class="hero-shade"></div>
        <div class="hero-content">
          <div class="hero-cat">${escapeHtml(featured.category)}</div>
          <h1 class="hero-title">${escapeHtml(featured.title)}</h1>
          ${featured.description ? `<p class="hero-desc">${escapeHtml(featured.description).slice(0, 220)}</p>` : ""}
          <div class="hero-actions">
            <button class="btn-primary" onclick="openConf('${featured.id}')">Regarder</button>
            <button class="btn-secondary" onclick="openConf('${featured.id}')">Plus d'infos</button>
          </div>
        </div>
      </div>
    ` : ""}
    ${chipsHtml}
    <div class="content">${bodyHtml}</div>
    <div id="modal-root"></div>
  `;

  if (featured && !q && !state.activeCategory) {
    const heroCover = getYoutubeThumbnail(featured.videoUrl) || featured.coverImage;
    if (heroCover) document.getElementById("hero-el").style.backgroundImage = `url("${heroCover}")`;
  }
  document.querySelectorAll(".conf-thumb[data-cover]").forEach(elm => {
    const cover = elm.getAttribute("data-cover");
    if (cover) elm.style.backgroundImage = `url("${cover}")`;
  });

  renderModal();
}

function renderCardHtml(c) {
  return `
    <button class="conf-card" onclick="openConf('${c.id}')">
      <div class="conf-thumb" data-cover="${escapeHtml(getYoutubeThumbnail(c.videoUrl) || c.coverImage)}">${getYoutubeThumbnail(c.videoUrl) || c.coverImage ? "" : "Pas d'image"}</div>
      <div class="conf-info">
        <div class="title">${escapeHtml(c.title)}</div>
        <div class="cat">${escapeHtml(c.category)}</div>
      </div>
    </button>
  `;
}

function renderRowHtml(title, items) {
  if (!items.length) return "";
  return `<div class="row"><h2>${escapeHtml(title)}</h2><div class="row-track">${items.map(renderCardHtml).join("")}</div></div>`;
}

function setCategory(cat) { state.activeCategory = cat; renderApp(); }

function handleSearch(value) {
  state.search = value;
  const wasFocused = document.activeElement && document.activeElement.id === "search-input";
  renderApp();
  if (wasFocused) {
    const inp = document.getElementById("search-input");
    inp.focus();
    inp.selectionStart = inp.selectionEnd = inp.value.length;
  }
}

function openConf(id) { state.selectedConfId = id; renderModal(); }
function closeConf() { state.selectedConfId = null; renderModal(); }

function renderModal() {
  const holder = document.getElementById("modal-root");
  if (!holder) return;
  const conf = state.conferences.find(c => c.id === state.selectedConfId);
  if (!conf) { holder.innerHTML = ""; return; }
  const embed = getEmbedUrl(conf.videoUrl);
  holder.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeConf()">
      <div class="modal-box">
        <div class="modal-video">
          ${embed
            ? `<iframe src="${escapeHtml(embed)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="${escapeHtml(conf.title)}"></iframe>`
            : `<div class="modal-fallback"><p>Lien vidéo non reconnu, ouvre-le directement :</p><a href="${escapeHtml(conf.videoUrl)}" target="_blank" rel="noreferrer">${escapeHtml(conf.videoUrl)}</a></div>`}
        </div>
        <div class="modal-body">
          <div class="modal-head">
            <div>
              <h3>${escapeHtml(conf.title)}</h3>
              <div class="hero-cat" style="margin-top:6px;">${escapeHtml(conf.category)}</div>
            </div>
            <button class="icon-btn" onclick="closeConf()">Fermer</button>
          </div>
          ${conf.description ? `<p class="modal-desc">${escapeHtml(conf.description)}</p>` : ""}
        </div>
      </div>
    </div>
  `;
}

function openAdmin() { state.showAdmin = true; render(); }
function closeAdmin() { state.showAdmin = false; render(); }

function renderAdminView() {
  const sorted = [...state.conferences].sort((a, b) => b.createdAt - a.createdAt);
  root.innerHTML = `
    ${offlineBannerHtml()}
    <div class="admin-wrap">
      <div class="admin-head">
        <h1>Gestion des conférences</h1>
        <button class="link-btn" onclick="closeAdmin()">Retour au site</button>
      </div>
      <div class="admin-grid">
        <div class="panel">
          <h2>Ajouter une conférence</h2>
          <form id="add-conf-form">
            <label class="field"><span>Titre</span><input id="c-title" /></label>
            <label class="field"><span>Catégorie</span><input id="c-category" placeholder="Ex : Montage, Growth, Storytelling" /></label>
            <label class="field"><span>Image de couverture (URL)</span><input id="c-cover" placeholder="https://..." /></label>
            <label class="field"><span>Lien vidéo (YouTube ou Vimeo)</span><input id="c-video" placeholder="https://www.youtube.com/watch?v=..." /></label>
            <label class="field"><span>Description</span><textarea id="c-desc" style="min-height:80px;"></textarea></label>
            <div id="add-conf-error"></div>
            <button type="submit" class="btn-primary" style="width:100%;">Ajouter</button>
          </form>
        </div>
        <div class="panel">
          <h2>Conférences en ligne (${sorted.length})</h2>
          <div class="conf-list">
            ${sorted.length === 0 ? `<p style="color:var(--muted); font-size:14px;">Rien pour l'instant.</p>` : sorted.map(c => `
              <div class="conf-list-item">
                <div style="min-width:0;">
                  <div class="title">${escapeHtml(c.title)}</div>
                  <div class="cat">${escapeHtml(c.category)}</div>
                </div>
                <button class="del-btn" onclick="deleteConf('${c.id}')">Suppr.</button>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("add-conf-form").addEventListener("submit", handleAddConf);
}

async function handleAddConf(e) {
  e.preventDefault();
  const title = document.getElementById("c-title").value.trim();
  const category = document.getElementById("c-category").value.trim();
  const coverImage = document.getElementById("c-cover").value.trim();
  const videoUrl = document.getElementById("c-video").value.trim();
  const description = document.getElementById("c-desc").value.trim();
  const errBox = document.getElementById("add-conf-error");
  if (!title || !category || !videoUrl) {
    errBox.innerHTML = `<p class="error-text">Titre, catégorie et lien vidéo sont obligatoires.</p>`;
    return;
  }
  const fresh = await loadConferences();
  fresh.push({
    id: (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2)),
    title, category, coverImage, videoUrl, description, createdAt: Date.now(),
  });
  state.conferences = fresh;
  await saveConferences(fresh);
  renderAdminView();
}

async function deleteConf(id) {
  const fresh = (await loadConferences()).filter(c => c.id !== id);
  state.conferences = fresh;
  await saveConferences(fresh);
  renderAdminView();
}

init();
</script>
</body>
</html>
